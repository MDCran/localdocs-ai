server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_set_header Host $http_host;
    }
    location / { try_files $uri $uri/ /index.html; }
}

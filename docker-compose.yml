name: localdocs-ai
services:
  database:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with scripts/setup.py}
      POSTGRES_DB: ${POSTGRES_DB:-localdocs}
    ports: ["127.0.0.1:${DATABASE_PORT:-5438}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6388}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-localdocs}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-localdocs}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      UPLOAD_DIR: /app/data/uploads
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-180}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    environment: *backend_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["uploads:/app/data/uploads"]
    ports: ["127.0.0.1:${API_PORT:-8008}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    environment: *backend_env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["uploads:/app/data/uploads"]
    command: ["python", "-m", "workers.main"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: apps/web
      dockerfile: ../../infrastructure/web.Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-5178}:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:

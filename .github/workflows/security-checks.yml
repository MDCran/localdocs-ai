name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Audit frontend dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.11.7'
          python-version: '3.12'

      - name: Audit backend dependencies
        run: |
          uv sync --frozen
          uv export --all-groups --frozen --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

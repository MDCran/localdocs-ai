name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: localdocs
          POSTGRES_PASSWORD: test-fixture-password
          POSTGRES_DB: localdocs_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U localdocs -d localdocs_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://localdocs:test-fixture-password@127.0.0.1:5432/localdocs_test
      TEST_DATABASE_URL: postgresql+asyncpg://localdocs:test-fixture-password@127.0.0.1:5432/localdocs_test
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv export --all-groups --frozen --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - run: uv run pip-audit -r /tmp/requirements.txt --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run build && npm test
      - run: npm audit --audit-level=moderate
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: localdocs
          POSTGRES_PASSWORD: browser-fixture-password
          POSTGRES_DB: localdocs_browser
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U localdocs -d localdocs_browser" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql+asyncpg://localdocs:browser-fixture-password@127.0.0.1:5432/localdocs_browser
      REDIS_URL: redis://127.0.0.1:6379/0
      OLLAMA_BASE_URL: http://127.0.0.1:11435
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen && uv run alembic upgrade head
      - name: Start browser fixtures
        run: |
          uv run uvicorn ollama_stub:app --app-dir tests/fixtures --port 11435 > /tmp/ollama.log 2>&1 &
          uv run uvicorn localdocs.main:app --port 8008 > /tmp/api.log 2>&1 &
          uv run python -m workers.main > /tmp/worker.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://localhost:8008/api/v1/ready && break || sleep 1; done
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: apps/web/test-results/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
